# The gateway holds the Orders API credential. Nothing else does.
#
# The MCP wrapper calls http://<gateway>/apis/orders with no credential at all.
# agentgateway rewrites the path, adds the X-API-Key header from a Secret in this
# namespace, and forwards to the API. The wrapper, the agent pod, and the team
# namespace never see the key, so there is nothing there to leak or rotate.
#
# The Secret is created by platform/gateway/orders-credential.sh, not committed.
# On a real cluster External Secrets Operator would source it from a vault.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: orders-api
  namespace: platform-gateway
spec:
  static:
    host: orders-api.demo-apis.svc.cluster.local
    port: 8000
  policies:
    auth:
      secretRef:
        name: orders-api-credentials
        key: apiKey
      location:
        header:
          name: X-API-Key
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-api
  namespace: platform-gateway
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path: {type: PathPrefix, value: /apis/orders}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
      backendRefs:
        - name: orders-api
          group: agentgateway.dev
          kind: AgentgatewayBackend
