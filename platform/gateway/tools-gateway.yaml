# PROTOTYPE. Platform-owned MCP tool gateway. agentgateway behind Gateway API.
# Container agents reach tools ONLY through here. The gateway checks a per-agent
# JWT and a per-agent tool allow-list (CEL) before anything reaches the MCP server.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: platform-tools
  namespace: platform-gateway
spec:
  mcp:
    failureMode: FailClosed
    targets:
      - name: kagent-tools
        static:
          host: kagent-tools.kagent.svc.cluster.local
          port: 8084
          path: /mcp
          protocol: StreamableHTTP
      - name: orders
        static:
          host: orders-mcp.kagent.svc.cluster.local
          port: 8080
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-tools
  namespace: platform-gateway
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path: {type: PathPrefix, value: /mcp/platform-tools}
      backendRefs:
        - name: platform-tools
          group: agentgateway.dev
          kind: AgentgatewayBackend
---
# Default deny. Only per-agent Allow policies (rendered from agent.yaml) open tools.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: platform-tools-default-deny
  namespace: platform-gateway
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: platform-tools
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - 'false'
