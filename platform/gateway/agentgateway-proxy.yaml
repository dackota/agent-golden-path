# The one agentgateway data plane. All MCP (and later LLM) traffic goes through it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - protocol: HTTP
      port: 80
      name: http
      allowedRoutes:
        namespaces:
          from: All
---
# Every request through the proxy becomes a span and an access log line at the
# platform collector. MCP calls carry mcp.method.name, mcp.target, and
# gen_ai.tool.name, so "which agent called which tool" is answered here.
# The proxy honours an inbound traceparent, so an agent's trace continues.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: proxy-telemetry
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-proxy
  frontend:
    tracing:
      backendRef:
        name: otel-collector
        namespace: platform-observability
        port: 4317
      protocol: GRPC
      randomSampling: "true"
    accessLog:
      otlp:
        backendRef:
          name: otel-collector
          namespace: platform-observability
          port: 4317
        protocol: GRPC
