# The OpenTelemetry Collector. Platform-owned. Service name otel-collector,
# which is what the agent chart, kagent, LiteLLM, and agentgateway send to.
#
# It receives OTLP on 4317 and 4318, scrapes the three platform metrics
# endpoints, and forwards everything to one OTLP backend. On kind the backend
# is the otel-lgtm pod (platform/observability/otel-lgtm.yaml). On a real
# cluster change OTEL_BACKEND_ENDPOINT to the org's collector or Grafana
# stack, or to Langfuse at /api/public/otel with its auth header. Agents do
# not change.
#
# Install: see the platform target in the Makefile.
mode: deployment
replicaCount: 1
fullnameOverride: otel-collector
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}

# Only the two OTLP ports. The chart opens Jaeger and Zipkin by default.
ports:
  otlp: {enabled: true}
  otlp-http: {enabled: true}
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}

# Pod discovery for the agentgateway scrape, and the kagent controller's
# /metrics behind kube-rbac-proxy style auth.
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: [pods, services, endpoints]
      verbs: [get, list, watch]
    - nonResourceURLs: [/metrics]
      verbs: [get]

extraEnvs:
  - name: OTEL_BACKEND_ENDPOINT
    value: http://otel-lgtm.platform-observability.svc.cluster.local:4318
  # Minted by the platform minter. It can read /metrics and call no model.
  - name: LITELLM_METRICS_KEY
    valueFrom: {secretKeyRef: {name: litellm-metrics-key, key: LITELLM_API_KEY}}

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
    prometheus:
      config:
        scrape_configs:
          # Spend and tokens per key alias and team.
          - job_name: litellm
            scrape_interval: 30s
            metrics_path: /metrics/
            authorization:
              credentials: ${env:LITELLM_METRICS_KEY}
            static_configs:
              - targets: [litellm.platform-gateway.svc.cluster.local:4000]
          # Requests, latency, and MCP calls through the tool and agent gateway.
          - job_name: agentgateway
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: pod
                namespaces: {names: [agentgateway-system]}
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_gateway_networking_k8s_io_gateway_name]
                regex: agentgateway-proxy
                action: keep
              - source_labels: [__meta_kubernetes_pod_ip]
                target_label: __address__
                replacement: $1:15020
          # kagent controller. Reconcile counts and errors.
          - job_name: kagent-controller
            scrape_interval: 30s
            scheme: https
            tls_config: {insecure_skip_verify: true}
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            static_configs:
              - targets: [kagent-controller-metrics.kagent.svc.cluster.local:8443]
  processors:
    memory_limiter: {check_interval: 5s, limit_percentage: 80, spike_limit_percentage: 25}
    batch: {}
  exporters:
    otlphttp/backend:
      endpoint: ${env:OTEL_BACKEND_ENDPOINT}
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/backend]
      metrics:
        receivers: [otlp, prometheus]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/backend]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/backend]
