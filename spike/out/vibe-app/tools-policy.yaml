apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: tools-allow-demo-vibe-app
  namespace: platform-gateway
  labels:
    app.kubernetes.io/name: vibe-app
    platform.suresteel.com/team: demo
    platform.suresteel.com/kind: container
  annotations:
    platform.suresteel.com/owner: dackota.johnson@suresteel.com
    platform.suresteel.com/description: A vibe-coded chat app that calls an LLM.
spec:
  targetRefs:
  - group: agentgateway.dev
    kind: AgentgatewayBackend
    name: platform-tools
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
          - jwt.sub == "team-demo/vibe-app" && mcp.tool.name in ["k8s_describe_resource",
            "k8s_get_pod_logs", "k8s_get_resources"]
