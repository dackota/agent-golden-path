apiVersion: v1
kind: Namespace
metadata:
  name: team-demo
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxClaim
metadata:
  name: data-cruncher
  namespace: team-demo
  labels:
    app.kubernetes.io/name: data-cruncher
    platform.suresteel.com/team: demo
    platform.suresteel.com/kind: codeexec
  annotations:
    platform.suresteel.com/owner: dackota.johnson@suresteel.com
    platform.suresteel.com/description: Runs generated Python over CSV files.
spec:
  warmPoolRef:
    name: platform-python-pool
  lifecycle:
    shutdownPolicy: Delete
