apiVersion: v1
kind: Namespace
metadata:
  name: team-demo
---
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: faq-helper-model
  namespace: team-demo
  labels:
    app.kubernetes.io/name: faq-helper
    platform.suresteel.com/team: demo
    platform.suresteel.com/kind: prompt
spec:
  provider: OpenAI
  model: default-chat
  apiKeySecret: faq-helper-llm-key
  apiKeySecretKey: LLM_API_KEY
  openAI:
    baseUrl: http://litellm.platform-gateway.svc.cluster.local:4000
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: faq-helper
  namespace: team-demo
  labels:
    app.kubernetes.io/name: faq-helper
    platform.suresteel.com/team: demo
    platform.suresteel.com/kind: prompt
  annotations:
    platform.suresteel.com/owner: dackota.johnson@suresteel.com
    platform.suresteel.com/description: Answers questions about the SureSteel agent
      platform.
spec:
  type: Declarative
  description: Answers questions about the SureSteel agent platform.
  declarative:
    modelConfig: faq-helper-model
    systemMessage: 'You are the SureSteel platform FAQ helper. Answer in two sentences
      or fewer.

      If you do not know, say so.

      '
    tools:
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: kagent-tool-server
        namespace: kagent
        toolNames:
        - k8s_get_resources
        - k8s_describe_resource
        - k8s_get_pod_logs
    deployment:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: '1'
          memory: 512Mi
