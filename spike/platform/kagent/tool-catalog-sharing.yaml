# PROTOTYPE. Platform-owned. Lets team namespaces use the shared tool catalog.
# kagent refuses cross-namespace tool references unless the owner opts in here.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: kagent-tool-server
  namespace: kagent
spec:
  allowedNamespaces:
    from: Selector
    selector:
      matchLabels:
        platform.suresteel.com/agent-namespace: "true"
