# PROTOTYPE. Platform-owned Argo wiring. One AppProject per team, one ApplicationSet for all teams.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: team-demo
  namespace: argocd
spec:
  description: Agents owned by team demo
  sourceRepos:
    - https://github.com/dackota/agent-deployments.git
  destinations:
    - namespace: team-demo
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []          # no cluster-scoped resources, ever
  namespaceResourceBlacklist:
    - {group: "", kind: ResourceQuota}
    - {group: "", kind: LimitRange}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: agents
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - git:
        repoURL: https://github.com/dackota/agent-deployments.git
        revision: main
        directories:
          - path: agents/*/*
  template:
    metadata:
      name: 'agent-{{ index .path.segments 1 }}-{{ .path.basename }}'
      labels:
        platform.suresteel.com/team: '{{ index .path.segments 1 }}'
    spec:
      project: 'team-{{ index .path.segments 1 }}'
      sources:
        - repoURL: https://github.com/dackota/agent-deployments.git
          targetRevision: main
          path: charts/agent
          helm:
            releaseName: '{{ .path.basename }}'
            valueFiles:
              - '$values/{{ .path.path }}/values.yaml'
        - repoURL: https://github.com/dackota/agent-deployments.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: 'team-{{ index .path.segments 1 }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
