{{- if eq .Values.kind "container" }}
# Default deny. In: the platform gateway and your own namespace. Out: DNS, the
# LLM gateway, the tool gateway, the OTel collector. Nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}
  labels: {{- include "agent.labels" . | nindent 4 }}
  {{- with .Values.egress }}
  annotations:
    # Hostname egress needs an FQDN-aware CNI (Cilium toFQDNs) or an egress proxy.
    # Recorded here so the platform can act on it.
    platform.suresteel.com/requested-egress: {{ join "," . | quote }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: agentgateway-system}
        - podSelector: {}
      ports: [{port: {{ .Values.port }}, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: platform-gateway}
          podSelector:
            matchLabels: {app: litellm}
      ports: [{port: 4000, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: agentgateway-system}
          podSelector:
            matchLabels: {gateway.networking.k8s.io/gateway-name: agentgateway-proxy}
      ports: [{port: 80, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: platform-observability}
      ports: [{port: 4318, protocol: TCP}]
{{- end }}
