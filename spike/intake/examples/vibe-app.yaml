# kind=container: a vibe-coded HTTP app. Runs on the universal agent Helm chart.
name: vibe-app
team: demo
owner: dackota.johnson@suresteel.com
kind: container
description: A vibe-coded chat app that calls an LLM.
model: default-chat
systemPrompt: |
  You are a friendly helper. Keep answers under 30 words.
tools:
  - name: k8s-readonly
container:
  image: spike/vibe-app:0.2.0
  port: 8080
  replicas: 1
budget:
  usdPerMonth: 10
