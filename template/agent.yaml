# The one file the platform reads. Keep image tag equal to VERSION.
name: ci-app
team: demo
owner: dackota.j@gmail.com
kind: container
description: Template agent built and signed by the shared golden-path workflow.
model: default-chat
systemPrompt: |
  You are a helpful assistant. Use tools when they help. Keep answers under 40 words.
tools:
  - name: k8s-readonly
container:
  image: ghcr.io/dackota/agent-app-template:0.4.0
  port: 8080
  replicas: 1
budget:
  usdPerMonth: 10
