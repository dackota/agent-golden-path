# PROTOTYPE. Shared build for any agent repo on the golden path.
# Callers: uses: dackota/agent-golden-path/.github/workflows/build-agent.yml@main
# Does: validate agent.yaml, build image, push to GHCR, SBOM, keyless cosign sign, verify.
name: build-agent
on:
  workflow_call:
    inputs:
      context:
        description: Docker build context
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
    outputs:
      image:
        description: Image reference with digest
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign via GitHub OIDC
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate agent.yaml
        run: |
          python3 - <<'PY'
          import re, sys, yaml
          d = yaml.safe_load(open("agent.yaml"))
          need = ["name", "team", "owner", "kind", "description"]
          miss = [k for k in need if k not in d]
          if miss: sys.exit(f"agent.yaml missing {miss}")
          if d["kind"] == "container":
              img = d.get("container", {}).get("image", "")
              if not re.match(r"^(ghcr\.io/suresteel|ghcr\.io/dackota)/[a-z0-9./-]+:[A-Za-z0-9._-]+$", img):
                  sys.exit(f"image {img!r} not from an allowed registry, or uses :latest")
              if img.split(":")[-1] != open("VERSION").read().strip():
                  sys.exit("agent.yaml image tag must equal VERSION")
          print("agent.yaml ok:", d["name"], d["kind"])
          PY

      - name: Version and image name
        id: meta
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}

      - name: Image ref with digest
        id: ref
        run: echo "image=${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.ref.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

      - uses: sigstore/cosign-installer@v3

      - name: Sign (keyless) and attach SBOM
        run: |
          cosign sign --yes "${{ steps.ref.outputs.image }}"
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${{ steps.ref.outputs.image }}"

      - name: Verify signature
        run: |
          cosign verify "${{ steps.ref.outputs.image }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/dackota/agent-golden-path/.github/workflows/build-agent.yml@' \
            -o text
          echo "SIGNED_OK ${{ steps.ref.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
