# Builds and signs the platform minter image when its source changes.
name: publish-minter
on:
  push:
    branches: [main]
    paths: [platform/minter/**]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=$(cat platform/minter/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: platform/minter
          push: true
          provenance: false
          tags: ghcr.io/dackota/agent-minter:${{ steps.v.outputs.version }}
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/dackota/agent-minter@${{ steps.push.outputs.digest }}
