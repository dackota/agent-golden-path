# Builds and signs the platform-owned images when their source changes.
name: publish-images
on:
  push:
    branches: [main]
    paths: [platform/minter/**, platform/tools/github-prs/**, examples/orders/**]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - {name: agent-minter, context: platform/minter}
          - {name: orders-demo,  context: examples/orders}
          - {name: github-prs-mcp, context: platform/tools/github-prs}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=$(cat ${{ matrix.context }}/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: false
          tags: ghcr.io/dackota/${{ matrix.name }}:${{ steps.v.outputs.version }}
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/dackota/${{ matrix.name }}@${{ steps.push.outputs.digest }}
