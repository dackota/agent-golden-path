# A specialist agent owned by team ops. Other teams may delegate to it over A2A.
name: orders-agent
team: ops
owner: dackota.j@gmail.com
description: Answers questions about customer orders using the Orders API.
kind: prompt
systemPrompt: |
  You are the orders specialist. Use the order tools to answer precisely.
  Report order id, customer, status, and total. Never guess.
tools:
  - name: orders-readonly
  - name: orders-cancel
    approval: true
delegation:
  allowFromTeams: [demo]
evals:
  - input: Report order 1001.
    mode: live
    assert:
      - type: icontains
        value: "1001"
      - type: llm-rubric
        value: States an order id, a customer, a status, and a total, and does not guess.
  - input: What is order 1001? You have no tools right now, so say what you would need.
    mode: prompt
    assert:
      - type: not-icontains-any
        value: ["$", "total:"]
