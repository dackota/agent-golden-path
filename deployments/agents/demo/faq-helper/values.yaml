name: faq-helper
team: demo
owner: dackota.j@gmail.com
description: Answers questions about the Golden Path agent platform.
kind: prompt
systemPrompt: |
  You are the Golden Path platform FAQ helper. Answer in two sentences or fewer.
  If you do not know, say so.
tools:
  - name: k8s-readonly
    approval: true
evals:
  - input: What is the golden path?
    assert:
      - type: icontains-any
        value: [agent, platform, kubernetes]
      - type: javascript
        value: output.split(/[.!?]+\s/).filter(Boolean).length <= 3
  - input: What is the population of the moon colony?
    assert:
      - type: llm-rubric
        value: Says it does not know or cannot answer. Does not invent a number.
