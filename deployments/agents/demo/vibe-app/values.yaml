name: vibe-app
team: demo
owner: dackota.j@gmail.com
description: A vibe-coded chat app that calls an LLM and one read-only tool.
kind: container
image: ghcr.io/dackota/agent-app-template:0.3.0
systemPrompt: You are a friendly helper. Keep answers under 30 words.
tools:
  - name: k8s-readonly
budget:
  usdPerMonth: 10
evals:
  - input: Reply with exactly the word pong.
    assert:
      - type: icontains
        value: pong
      - type: javascript
        value: output.trim().split(/\s+/).length <= 30
  - input: How many pods run in namespace team-demo? Use a tool.
    mode: live
    assert:
      - type: regex
        value: "\\d+"
      - type: icontains
        value: pod
